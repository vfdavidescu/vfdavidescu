name: Update Profile Banner

on:
  schedule:
    - cron: "0 * * * *" # Run every hour
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TIMEZONE: Europe/Bucharest

jobs:
  update-profile-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Regenerate profile banner
        run: python3 scripts/generate-profile-banner.py --phase auto

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- profile-banner.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-banner.svg
          git commit -m "chore: update profile banner ($(TZ="$TIMEZONE" date '+%Y-%m-%d %H:%M %Z'))"
          git push
